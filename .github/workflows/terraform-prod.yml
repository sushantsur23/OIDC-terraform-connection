# Pipeline: plan on pull requests; on merge to main, apply, wait 2 minutes,
# then destroy. Step logic lives in scripts/, and run-logged.sh sends each
# step's output to CloudWatch (log group test_group, one stream per process).
# Setup in GitHub:
#   1. Settings > Secrets and variables > Actions > Variables:
#      AWS_ROLE_ARN = output `github_actions_role_arn` from terraform/bootstrap
#   2. Settings > Environments: create "prod" and add required reviewers,
#      so every apply waits for manual approval.

name: terraform-prod

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", "scripts/**", ".github/workflows/terraform-prod.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", "scripts/**", ".github/workflows/terraform-prod.yml"]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read
  pull-requests: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "us-east-1"
  WORKDIR: terraform/environments/prod
  SECRET_ID: sushant-app/prod/ci-test-keys # AWS Secrets Manager, created outside Terraform
  SCRIPTS: ${{ github.workspace }}/scripts
  LOG_GROUP: test_group # CloudWatch log group from terraform/bootstrap
  LOG_REGION: us-west-2 # bootstrap region, where the log group lives

jobs:
  plan:
    runs-on: ubuntu-latest # no environment here, so PR plans don't wait for approval
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Ensure secrets exist
        run: bash "$SCRIPTS/run-logged.sh" ensure-secrets.sh
      - name: Read secrets
        run: bash "$SCRIPTS/run-logged.sh" read-secrets.sh
      - name: Terraform plan
        run: bash "$SCRIPTS/run-logged.sh" terraform.sh plan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 5

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod # add required reviewers on this environment for manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}

      - name: Terraform apply
        run: bash "$SCRIPTS/run-logged.sh" terraform.sh apply

  destroy:
    needs: apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # no environment, so it runs without a second approval
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Wait 2 minutes, then terraform destroy
        run: bash "$SCRIPTS/run-logged.sh" terraform.sh destroy
